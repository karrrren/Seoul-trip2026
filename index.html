<style id="css">
/* Layout: paper-white phone app — sticky top menu, four views (home, plan, food, list); hairlines and soft fills, no heavy frames */
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --muted:#857F7B; --grey:#F1EEE8; --grey-2:#E7E3DC; --line:#E8E3DA;
  --orange:#FF5809; --orange-soft:#FFEDE3; --white:#FFFFFF;
  --walk:#2E8F63; --walk-s:#E3F2EA; --taxi:#A56B00; --taxi-s:#FCF0D2; --bus:#2F63C4; --bus-s:#E4ECFA;
  --cable:#7A4FC4; --cable-s:#EEE7FA; --car:#55606C; --car-s:#E9ECEF; --plane:#127FAD; --plane-s:#E0F1F8;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r-lg:20px; --r-md:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,252,246,.96);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line)}
.topbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;height:52px}
.brand{font-weight:700;font-size:15px;letter-spacing:.04em;white-space:nowrap}
.brand i{font-style:normal;color:var(--orange)}
.tabs{display:flex;gap:2px;margin-left:auto;height:100%}
.tabs button{border:0;background:none;padding:0 10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;position:relative;height:100%}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--orange)}
@media (max-width:380px){.brand{display:none}.tabs{margin-left:0;width:100%;justify-content:space-between}}

h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
.box{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.sec-title h2{font-size:18px;font-weight:700}
.sec-title .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.hero{margin-top:16px;overflow:hidden}
.hero svg{display:block;width:100%;height:auto;background:var(--grey)}
.hero .txt{padding:18px 18px 20px;display:grid;gap:6px}
.hero h1{font-size:28px;font-weight:900;letter-spacing:.02em}
.hero .crew{color:var(--muted);font-size:14px}
.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cd div{background:var(--grey);border-radius:var(--r-md);padding:10px 4px;text-align:center}
.cd b{display:block;font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cd div:first-child b{color:var(--orange)}
.cd span{font-size:12px;color:var(--muted)}
.cd-note{font-size:13px;color:var(--muted)}

.flights{display:grid;gap:12px}
.flight{display:grid;gap:12px;padding:16px}
.flight .head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.flight .no{font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.flight .date{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.route .pt b{display:block;font-size:28px;font-weight:700;line-height:1.1;letter-spacing:.04em}
.route .pt span{font-size:12px;color:var(--muted)}
.route .pt.r{text-align:right}
.route .mid{display:grid;justify-items:center;font-size:12px;color:var(--muted)}
.route .mid svg{width:56px;height:14px}
.times{display:flex;justify-content:space-between;border-top:1px dashed var(--grey-2);padding-top:10px;font-variant-numeric:tabular-nums}
.times b{font-size:20px;font-weight:700}
.times .warn{color:var(--orange)}

.days{display:grid;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.dayrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left;width:100%}
.dayrow:first-child{border-top:0}
.dayrow .dt{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.2}
.dayrow .dt small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.dayrow .tt{min-width:0}
.dayrow .arrow{color:var(--muted);transition:transform .15s,color .15s}
.dayrow:hover .arrow{color:var(--orange);transform:translateX(3px)}

.datebar{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.datebar::-webkit-scrollbar{display:none}
.date{flex:none;border:0;background:var(--grey);border-radius:var(--r-md);padding:7px 12px;min-width:62px;text-align:center;cursor:pointer;transition:background .15s,color .15s}
.date b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.date span{display:block;font-size:12px;color:var(--muted)}
.date[aria-pressed="true"]{background:var(--orange);color:var(--white)}
.date[aria-pressed="true"] span{color:var(--white);opacity:.85}
.dayhead{margin-top:16px;display:grid;gap:4px}
.dayhead h2{font-size:22px;font-weight:900}
.dayhead .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.dayhead .meta b{color:var(--orange);font-weight:700}

.routemap .gmap{margin-left:auto;color:var(--orange);font-weight:700;text-decoration:none}
.routemap{margin-top:14px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.routemap svg{display:block;width:100%;height:auto}
.routemap .cap{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 14px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.routemap .cap i{display:inline-block;width:22px;height:0;border-top:3px solid var(--orange);vertical-align:middle;margin-right:6px}
.routemap .cap i.d{border-top-style:dashed}
.num{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--white);font-size:11px;font-weight:700;margin-right:8px;vertical-align:1px}
.num.h{background:var(--orange)}
.timeline{list-style:none;margin:18px 0 0;padding:0 0 0 20px;position:relative}
.timeline::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--grey-2)}
.stop{position:relative;margin-bottom:14px}
.stop::before{content:"";position:absolute;left:-20px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--muted)}
.stop.must::before{background:var(--orange);border-color:var(--orange)}
.stop .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;margin-bottom:6px;color:var(--muted)}
.stop.must .tm{color:var(--ink)}
.card{padding:14px 16px;display:grid;gap:6px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:6px;padding:0 7px;line-height:1.8}
.tag svg{width:12px;height:12px}
.tag.walk{background:var(--walk-s);color:var(--walk)}
.tag.taxi{background:var(--taxi-s);color:var(--taxi)}
.tag.bus{background:var(--bus-s);color:var(--bus)}
.tag.cable{background:var(--cable-s);color:var(--cable)}
.tag.car{background:var(--car-s);color:var(--car)}
.tag.plane{background:var(--plane-s);color:var(--plane)}
.tag.must{background:var(--orange);color:var(--white);font-weight:700}
.tag.flag{background:var(--orange-soft);color:var(--orange)}
.card h3{font-size:17px;font-weight:700}
.ko{font-size:13px;color:var(--muted)}
.note{margin:0;font-size:14px}
.alt{background:var(--grey);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:3px;margin-top:2px}
.alt .lbl{font-size:12px;font-weight:700;color:var(--orange)}
.split{display:grid;gap:8px}
.split > div{background:var(--grey);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:4px}
.split .who{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--grey);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:background .15s,color .15s}
.btn svg{width:15px;height:15px}
.btn:hover,.btn:active{background:var(--orange);color:var(--white)}
.btn.solid{background:var(--ink);color:var(--white)}
.btn.solid:hover,.btn.solid:active{background:var(--orange)}
.naver .n{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:#03C75A;color:var(--white);font-size:10px;font-weight:900}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}

.pagehead{margin-top:20px;display:grid;gap:4px}
.pagehead h1{font-size:26px;font-weight:900}
.pagehead p{margin:0;font-size:14px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-block:14px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .btn{flex:none;font-size:14px;padding:5px 14px}
.filters .btn[aria-pressed="true"]{background:var(--orange);color:var(--white)}
.foodlist{display:grid;gap:10px}
.food .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.food h3{min-width:0}
.food .hrs{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.addr{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--muted)}
.addr svg{width:14px;height:14px;flex:none;margin-top:4px;color:var(--orange)}

.bar{height:6px;border-radius:999px;background:var(--grey-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--orange);transition:width .3s}
.hotel{padding:16px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.checks{padding:4px 16px}
.check{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{appearance:none;flex:none;width:22px;height:22px;border:1.5px solid #C9C3BA;border-radius:7px;background:var(--white);margin:1px 0 0;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.check input:checked{background:var(--orange);border-color:var(--orange)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--white);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check.done span{color:var(--muted);text-decoration:line-through}
.phrases{padding:4px 16px}
.phrase{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.phrase:first-child{border-top:0}
.phrase .k{font-size:17px;font-weight:700}
.phrase .zh{font-size:13px;color:var(--muted)}
.tips{padding:16px;background:var(--grey);border-radius:var(--r-lg);font-size:14px}
.tips ul{margin:0;padding-left:18px;display:grid;gap:6px}
.guides{display:grid;gap:12px}
.guide{padding:16px;display:grid;gap:10px}
.guide h3{font-size:16px;font-weight:700}
.guide ul{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.guide li::marker{color:var(--orange)}

.modal{position:fixed;inset:0;z-index:20;background:rgba(62,58,57,.5);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{background:var(--paper);border-radius:var(--r-lg);padding:24px 18px;width:min(100%,520px);display:grid;gap:10px;text-align:center}
.mcard .lead{font-size:13px;color:var(--muted)}
.mcard .say{font-size:20px;font-weight:700;color:var(--orange)}
.mcard .big{font-size:34px;font-weight:900;line-height:1.3;overflow-wrap:anywhere}
.mcard .addr2{font-size:18px}
.mcard .zh{font-size:13px;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){
  .float{animation:float 5s ease-in-out infinite}
  .leaf{animation:fall 8s linear infinite}
  .leaf.b{animation-duration:10s;animation-delay:-3s}
  .leaf.c{animation-duration:9s;animation-delay:-6s}
  .leaf.d{animation-duration:11s;animation-delay:-1.5s}
  .cablecar{animation:ride 10s ease-in-out infinite alternate}
  .steam path{animation:steam 3s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:.7s}
  .steam path:nth-child(3){animation-delay:1.4s}
  .bounce{animation:bounce .5s cubic-bezier(.3,1.5,.5,1) both}
  .date[aria-pressed="true"]{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(-40px,240px) rotate(300deg)}}
@keyframes ride{from{transform:translate(0,0)}to{transform:translate(64px,-38px)}}
@keyframes bounce{0%{opacity:.4;transform:translateY(14px)}60%{opacity:1;transform:translateY(-4px)}100%{transform:none}}
@keyframes steam{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

/* editing */
.editbtn{border:0;background:var(--ink);color:var(--white);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-left:6px;flex:none}
.editbtn:hover{background:var(--orange)}
body.editing{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.editing .editbtn{display:none}
.ed{border-radius:6px;outline:1px dashed #CFC8BD;outline-offset:2px;cursor:text;min-width:2em;display:block}
span.ed,b.ed,strong.ed{display:inline-block}
.ed:focus{outline:2px solid var(--orange);background:var(--orange-soft)}
.ed:empty::before{content:attr(data-ph);color:#B4ADA4;font-weight:400}
.etools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;margin-top:4px;border-top:1px dashed var(--grey-2)}
.etools select,.etools label{font:inherit;font-size:13px}
.etools select{border:1px solid var(--line);border-radius:8px;padding:2px 6px;background:var(--white);color:var(--ink)}
.etools label{display:inline-flex;gap:4px;align-items:center}
.ebtn{border:0;background:var(--grey);border-radius:8px;padding:2px 10px;font-size:13px;cursor:pointer}
.ebtn:hover{background:var(--orange);color:var(--white)}
.ebtn.del{color:#B23A1E}
.ebtn.del:hover{background:#B23A1E;color:var(--white)}
.addbtn{width:100%;border:1.5px dashed #CFC8BD;background:transparent;border-radius:var(--r-md);padding:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;margin-top:4px}
.addbtn:hover{border-color:var(--orange);color:var(--orange)}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--ink);color:var(--white);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.editbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.editbar .msg{flex:1;min-width:0;font-size:13px;opacity:.9}
.editbar button{border:0;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:700;cursor:pointer}
.editbar .cancel{background:transparent;color:var(--white);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.editbar .save{background:var(--orange);color:var(--white)}
.editbar .save:disabled{opacity:.6;cursor:default}
</style>

const HOTEL_LL=[37.5627,126.9783];
function isHotel(t){return Math.abs(t.lat-HOTEL_LL[0])<2e-4&&Math.abs(t.lng-HOTEL_LL[1])<2e-4}
function routeMap(day){
  NUMS=[];const pts=[],segs=[];let n=0,prev=null;
  day.stops.forEach((s,j)=>{
    const tg=s.split?s.split.filter(x=>x.lat!=null):(s.lat!=null?[s]:[]);
    if(!tg.length) return;
    const h=tg.length===1&&isHotel(tg[0]);
    const lab=h?'H':String(++n);NUMS[j]=lab;
    tg.forEach(t=>{pts.push({lat:+t.lat,lng:+t.lng,lab,h:isHotel(t)});if(prev) segs.push({a:prev,b:t,go:t.go||s.go})});
    prev=tg[tg.length-1];
  });
  ROUTE={pts,segs};
  if(pts.length<2){ROUTE=null;return ''}
  const airport=day.stops.some(s=>(s.go==='plane'||s.go==='car')&&s.lat==null);
  const k=Math.cos(37.56*Math.PI/180);
  const X=p=>p[1]*k,Y=p=>-p[0];
  const ll=pts.map(p=>[p.lat,p.lng]);
  let x0=Math.min(...ll.map(X)),x1=Math.max(...ll.map(X)),y0=Math.min(...ll.map(Y)),y1=Math.max(...ll.map(Y));
  const W=340,H=230;
  const cx=(x0+x1)/2,cy=(y0+y1)/2;
  const sc=Math.min((W-80)/Math.max(x1-x0,0.014),(H-64)/Math.max(y1-y0,0.010));
  const P=p=>[(X(p)-cx)*sc+W/2,(Y(p)-cy)*sc+H/2];
  const f=v=>v.toFixed(1);
  const path=(arr,close)=>arr.map((p,i)=>{const [x,y]=P(p);return (i?'L':'M')+f(x)+' '+f(y)}).join('')+(close?'Z':'');
  const inV=([x,y],m=0)=>x>m&&x<W-m&&y>m&&y<H-m;
  const fs=v=>`font-family="Noto Sans TC,sans-serif" font-size="${v}"`;
  let base=`<rect width="${W}" height="${H}" fill="#F5F2EB"/>`;
  GEO.green.forEach(g=>base+=`<path d="${path(g.p,1)}" fill="#E1EAD3" stroke="#E1EAD3" stroke-width="6" stroke-linejoin="round"/>`);
  GEO.palace.forEach(g=>base+=`<path d="${path(g.p,1)}" fill="#F0E4CC"/>`);
  GEO.roads.forEach(r=>base+=`<path d="${path(r)}" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`);
  const rw=Math.max(8,0.0075*sc);
  base+=`<path d="${path(GEO.river)}" fill="none" stroke="#CFE2EC" stroke-width="${f(rw)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  GEO.streams.forEach(r=>base+=`<path d="${path(r)}" fill="none" stroke="#CFE2EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`);
  let labs='';
  const rl=GEO.river.map(P).filter(p=>inV(p,30));
  if(rl.length){const q=rl[Math.floor(rl.length/2)];labs+=`<text x="${f(q[0])}" y="${f(q[1]+3)}" text-anchor="middle" ${fs(9)} font-weight="700" fill="#7FA3B8" letter-spacing="3">漢江</text>`}
  GEO.green.forEach(g=>{const q=P(g.c);if(inV(q,14))labs+=`<text x="${f(q[0])}" y="${f(q[1]+3)}" text-anchor="middle" ${fs(8.5)} fill="#7E9A6A">${g.n}</text>`});
  GEO.palace.forEach(g=>{const xs=g.p.map(P),q=[xs.reduce((a,b)=>a+b[0],0)/xs.length,xs.reduce((a,b)=>a+b[1],0)/xs.length];if(inV(q,14)&&sc>4000)labs+=`<text x="${f(q[0])}" y="${f(q[1]+3)}" text-anchor="middle" ${fs(8)} fill="#A88B5A">${g.n}</text>`});
  GEO.labels.forEach(([t,a,b])=>{const q=P([a,b]);if(inV(q,16))labs+=`<text x="${f(q[0])}" y="${f(q[1])}" text-anchor="middle" ${fs(10)} font-weight="700" fill="#B5ADA3" letter-spacing="1">${t}</text>`});
  let lines='';segs.forEach(({a,b,go})=>{const [ax,ay]=P([+a.lat,+a.lng]),[bx,by]=P([+b.lat,+b.lng]);if(Math.hypot(ax-bx,ay-by)<1)return;
    lines+=`<path d="M${f(ax)} ${f(ay)}L${f(bx)} ${f(by)}" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity=".8"/><path d="M${f(ax)} ${f(ay)}L${f(bx)} ${f(by)}" stroke="#FF5809" stroke-width="3" stroke-linecap="round"${go==='walk'?'':' stroke-dasharray="6 6"'} fill="none"/>`});
  const groups=[];pts.forEach(p=>{const [x,y]=P([p.lat,p.lng]);let g2=groups.find(q=>Math.hypot(q.x-x,q.y-y)<3);if(g2){if(!g2.labs.includes(p.lab))g2.labs.push(p.lab);g2.h=g2.h||p.h}else groups.push({x,y,labs:[p.lab],h:p.h})});
  const placed=[];let dots='';
  const OFF=[[0,0],[16,-12],[16,12],[-16,-12],[-16,12],[0,-20],[0,20],[26,0],[-26,0],[28,-22],[-28,22]];
  groups.forEach(q=>{let x=q.x,y=q.y;for(const [dx,dy] of OFF){const nx=q.x+dx,ny=q.y+dy;if(nx>12&&nx<W-12&&ny>12&&ny<H-12&&!placed.some(o=>Math.hypot(o[0]-nx,o[1]-ny)<19)){x=nx;y=ny;break}}placed.push([x,y]);
    if(x!==q.x||y!==q.y) dots+=`<path d="M${f(q.x)} ${f(q.y)}L${f(x)} ${f(y)}" stroke="#857F7B" stroke-width="1"/>`;
    const txt=q.h?'H':q.labs.filter(l=>l!=='H').join('·');const w2=Math.max(18,txt.length*6.4+8);
    dots+=`<rect x="${f(x-w2/2)}" y="${f(y-9)}" width="${f(w2)}" height="18" rx="9" fill="${q.h?'#FF5809':'#3E3A39'}" stroke="#FFFFFF" stroke-width="2"/><text x="${f(x)}" y="${f(y+3.6)}" text-anchor="middle" ${fs(10)} font-weight="700" fill="#FFFFFF">${txt}</text>`});
  if(airport) dots+=`<g transform="translate(10 ${H-14})"><rect x="0" y="-11" width="86" height="18" rx="9" fill="#FFFFFF" stroke="#E8E3DA"/><text x="43" y="2" text-anchor="middle" ${fs(9.5)} font-weight="700" fill="#127FAD">← 往仁川機場</text></g>`;
  const kmPx=sc/(111.32*k)*k; // 1 km in px (X scaled by k)
  const bar=kmPx>120?0.5:1,bw=bar*sc/111.32;
  const scale=`<g transform="translate(${f(W-14-bw)} ${H-12})"><path d="M0 -4V0H${f(bw)}V-4" fill="none" stroke="#857F7B" stroke-width="1.2"/><text x="${f(bw/2)}" y="-6" text-anchor="middle" ${fs(8.5)} fill="#857F7B">${bar===1?'1 km':'500 m'}</text></g>`;
  const go=new Set(segs.map(s=>s.go==='walk'?'w':'d'));
  const gurl='https://www.google.com/maps/dir/'+pts.filter((p,i)=>!i||p.lat!==pts[i-1].lat||p.lng!==pts[i-1].lng).map(p=>p.lat+','+p.lng).join('/');
  return `<figure class="routemap" style="margin-inline:0;margin-bottom:0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(day.d)} 當天移動範圍地圖">${base}${labs}${lines}${dots}${scale}<g transform="translate(${W-16} 20)"><circle r="10" fill="#FFFFFF" opacity=".85"/><path d="M0 -7L3.5 2H-3.5Z" fill="#3E3A39"/><text y="8.5" text-anchor="middle" ${fs(6.5)} font-weight="700" fill="#3E3A39">N</text></g></svg>
  <figcaption class="cap">${go.has('w')?'<span><i></i>步行</span>':''}${go.has('d')?'<span><i class="d"></i>計程車・巴士・纜車</span>':''}<span>數字對應下方行程，H 是飯店</span><a class="gmap" href="${gurl}" target="_blank" rel="noopener">Google 地圖開啟 ↗</a></figcaption></figure>`;
}

      ${acts(f,p)}${E?tools(`food.${ci}.items`,fi):''}
    </article>`}).join('')}
    ${E?`<button class="addbtn" data-act="push" data-arr="food.${ci}.items" data-tpl="food">＋ 新增餐廳到「${esc(c.cat)}」</button>`:''}</div>`).join('')
    +(E?`<button class="addbtn" style="margin-top:20px" data-act="push" data-arr="food" data-tpl="cat">＋ 新增分類</button>`:'');
}

/* LIST */
function renderList(){
  const h='hotel.';
  $('#hotel').innerHTML=`<dl class="kv">
    <dt>飯店</dt><dd>${T('b',h+'name','','飯店名稱',1)}${T('span',h+'ko','ko','韓文名稱')}</dd>
    <dt>地址</dt><dd>${T('span',h+'addr','','韓文地址',1)}</dd>
    <dt>日期</dt><dd>${T('span',h+'stay','','入住退房',1)}</dd>
    <dt>最近車站</dt><dd>${T('span',h+'station','','車站',1)}</dd>
    <dt>小提醒</dt><dd>${T('span',h+'tip','','提醒',1)}</dd></dl>${acts(DATA.hotel,'hotel')}`;
  const done=store.get('seoul-checks2',[]);
  $('#checksWrap').innerHTML=`<div class="box checks">${DATA.checks.map((c,i)=>E
    ?`<div class="check" style="cursor:default;display:grid;gap:4px">${T('span',`checks.${i}.text`,'','待辦事項',1)}${tools('checks',i)}</div>`
    :`<label class="check${done.includes(c.id)?' done':''}"><input type="checkbox" id="chk-${esc(c.id)}" data-cid="${esc(c.id)}"${done.includes(c.id)?' checked':''}><span>${esc(c.text)}</span></label>`).join('')}</div>
    ${E?'<button class="addbtn" data-act="push" data-arr="checks" data-tpl="check">＋ 新增待辦</button>':''}`;
  updateProg();
  $('#phrasesWrap').innerHTML=`<div class="box phrases">${DATA.phrases.map((x,i)=>`<div class="phrase"${E?' style="display:grid"':''}><div>${T('div',`phrases.${i}.ko`,'k','韓文',1)}${T('div',`phrases.${i}.zh`,'zh','中文意思',1)}</div>${E?tools('phrases',i):`<button class="btn" data-phrase="${i}">放大</button>`}</div>`).join('')}</div>
    ${E?'<button class="addbtn" data-act="push" data-arr="phrases" data-tpl="phrase">＋ 新增句子</button>':''}`;
  $('#guidesWrap').innerHTML=(DATA.guides||[]).map((g,gi)=>`<div class="box guide">${T('h3',`guides.${gi}.title`,'','標題',1)}<ul>${g.items.map((t,i)=>`<li>${T('span',`guides.${gi}.items.${i}`,'','說明',1)}${E?tools(`guides.${gi}.items`,i):''}</li>`).join('')}</ul>${E?`<button class="addbtn" data-act="push" data-arr="guides.${gi}.items" data-tpl="tip">＋ 新增一行</button>`:''}</div>`).join('');
  $('#tipsWrap').innerHTML=`<div class="tips"><ul>${DATA.tips.map((t,i)=>`<li>${T('span',`tips.${i}`,'','提醒',1)}${E?tools('tips',i):''}</li>`).join('')}</ul>${E?'<button class="addbtn" data-act="push" data-arr="tips" data-tpl="tip">＋ 新增提醒</button>':''}</div>`;
}
function updateProg(){
  const ids=DATA.checks.map(c=>c.id);const n=store.get('seoul-checks2',[]).filter(x=>ids.includes(x)).length,t=ids.length;
  $('#progText').textContent=`已完成 ${n} / ${t} 項`;$('#progCount').textContent=`${n} / ${t}`;
  $('#progBar').style.width=(t?n/t*100:0)+'%';
}

function renderAll(animate){renderHome();renderDay(animate);renderFood();renderList()}

function showTab(t){
  ['home','plan','food','list'].forEach(x=>{$('#view-'+x).hidden=x!==t;$('#tab-'+x).setAttribute('aria-selected',x===t)});
  store.set('seoul-tab2',t);window.scrollTo({top:0,behavior:'instant'});
  if(t==='plan')setTimeout(initLiveMap,0);
}
function openModal(ko,addr,zh,phrase){
  $('#mLead').textContent=phrase?'放大給對方看':'請給司機看・운전기사님께 보여주세요';
  $('#mSay').hidden=!!phrase;$('#mBig').textContent=ko;$('#mAddr').textContent=addr||'';$('#mZh').textContent=zh||'';
  $('#modal').hidden=false;$('#mClose').focus();
}

/* templates for new rows */
const TPL={
  stop:()=>({t:'',go:'walk',name:'',ko:'',addr:'',note:'',flag:'',must:false}),
  food:()=>({name:'',ko:'',addr:'',hrs:'',note:''}),
  cat:()=>({cat:'新分類',items:[]}),
  check:()=>({id:'c'+Date.now().toString(36),text:''}),
  phrase:()=>({zh:'',ko:''}),
  tip:()=>''
};

/* editing */
function setEdit(on){
  E=on;document.body.classList.toggle('editing',on);$('#editBar').hidden=!on;
  $('#editMsg').textContent='編輯中：點虛線框的文字直接修改，改完按「儲存」。';
  $('#editSave').disabled=false;renderAll(false);
}
function markDirty(){dirty=true}
function buildHtml(){
  const rs=document.head&&document.head.querySelector('style');
  const reset=rs?rs.textContent:RESET_FALLBACK;
  const css=document.getElementById('css').textContent;
  const shell=document.getElementById('shell').innerHTML;
  const app=document.getElementById('app').textContent;
  const json=JSON.stringify(DATA).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +HEAD_BITS+'<style id="css">'+css+'</style>\n<template id="shell">'+shell+'</template>\n<div id="root"></div>\n<script type="application/json" id="trip-data">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n</body></html>';
}
async function save(){
  if(!art){$('#editMsg').textContent='目前無法儲存，請在 Claude 裡打開這個頁面再試。';return}
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  $('#editSave').disabled=true;$('#editMsg').textContent='儲存中…';
  try{await art.publish(buildHtml());dirty=false;$('#editMsg').textContent='已儲存，頁面會自動更新。'}
  catch(err){
    const c=err&&err.code;
    $('#editMsg').textContent=c==='conflict'?'有人剛更新了頁面，這次的修改沒存到，請重新整理後再改。'
      :(c==='not_writer'||c==='not_granted')?'你沒有編輯這個頁面的權限。'
      :c==='rate_limited'?'儲存太頻繁了，等一下再按儲存。'
      :'儲存失敗，請稍後再試一次。';
    $('#editSave').disabled=c==='conflict'||c==='not_writer'||c==='not_granted';
  }
}

/* events */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){showTab(t.dataset.tab);return}
  const g=e.target.closest('[data-goday]');if(g){curDay=+g.dataset.goday;renderDay(true);showTab('plan');return}
  const d=e.target.closest('[data-day]');if(d){curDay=+d.dataset.day;renderDay(true);return}
  const c=e.target.closest('[data-cat]');if(c){foodCat=c.dataset.cat;renderFood();return}
  const dr=e.target.closest('[data-drv]');if(dr){const o=getP(dr.dataset.drv);openModal(o.ko,o.addr,o.name);return}
  const ph=e.target.closest('[data-phrase]');if(ph){const o=DATA.phrases[+ph.dataset.phrase];openModal(o.ko,'',o.zh,true);return}
  const a=e.target.closest('[data-act]');
  if(a){
    const act=a.dataset.act;
    if(act==='move'||act==='del'){const arr=getP(a.dataset.arr),i=+a.dataset.i;
      if(act==='del') arr.splice(i,1); else {const j=i+(+a.dataset.dir);if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}}
    else if(act==='push') getP(a.dataset.arr).push(TPL[a.dataset.tpl]());
    else if(act==='altadd') getP(a.dataset.p).alt={name:'',ko:'',addr:'',note:''};
    else if(act==='altdel') delete getP(a.dataset.p).alt;
    markDirty();const y=window.scrollY;renderAll(false);window.scrollTo(0,y);return;
  }
  if(e.target.id==='editBtn'){setEdit(true);return}
  if(e.target.id==='editCancel'){DATA=JSON.parse(ORIG);dirty=false;setEdit(false);return}
  if(e.target.id==='editSave'){save();return}
  if(e.target.id==='mClose'||e.target.id==='modal')$('#modal').hidden=true;
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k||e.target.tagName==='SELECT'||e.target.type==='checkbox')return;
  setP(k,e.target.textContent.replace(/\s+\n/g,'\n').trim());markDirty();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')$('#modal').hidden=true;
  if(e.key==='Enter'&&e.target.isContentEditable&&!/note$/.test(e.target.dataset.k||'')){e.preventDefault();e.target.blur()}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.k;
  if(k){setP(k,e.target.type==='checkbox'?e.target.checked:e.target.value);markDirty();const y=window.scrollY;renderDay(false);window.scrollTo(0,y);return}
  if(e.target.dataset&&e.target.dataset.cid){const id=e.target.dataset.cid;let done=store.get('seoul-checks2',[]);
    done=e.target.checked?[...new Set([...done,id])]:done.filter(x=>x!==id);store.set('seoul-checks2',done);
    e.target.closest('.check').classList.toggle('done',e.target.checked);updateProg()}
});

/* init */
const now=new Date();
const ti=DATA.days.findIndex(d=>{const [m,dd]=String(d.d).split('/').map(Number);return now.getFullYear()===2026&&now.getMonth()+1===m&&now.getDate()===dd});
curDay=ti>=0?ti:Math.min(Math.max(+store.get('seoul-day2',0)||0,0),DATA.days.length-1);
renderAll(false);
const h=location.hash.slice(1);
showTab(['home','plan','food','list'].includes(h)?h:store.get('seoul-tab2','home'));

async function initEdit(){
  if(!window.claude||!window.claude.use) return false;
  try{art=await window.claude.use('artifact')}catch(e){art=null}
  if(!art) return true;
  let ok=true;
  try{const u=await window.claude.use('user');if(u) ok=await u.canEdit()}catch(e){}
  if(ok) $('#editBtn').hidden=false;
  return true;
}
initEdit().then(r=>{if(!r) window.addEventListener('load',()=>{initEdit()},{once:true})});
})();
</script>
</body></html>
